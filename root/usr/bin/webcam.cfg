# ---------------------------------------------------
# Configurazione WebCam su OpenWrt (letta da /etc/config/webcam)
# ---------------------------------------------------

wc_get() {
	local v
	v="$(/sbin/uci -q get "$1")"
	echo "${v:-$2}"
}

#
# System Setting
#
WC_NAME="$(wc_get system.@system[0].hostname webcam)"
WC_MAINTENANCE_MODE="$(wc_get webcam.@general[0].maintenance_mode 0)"
WC_LATITUDE="$(wc_get webcam.@general[0].latitude)"
WC_LONGITUDE="$(wc_get webcam.@general[0].longitude)"
WC_TEMP_SCALE="$(wc_get webcam.@general[0].temp_scale c)"
WC_SERIAL_PORT="$(wc_get webcam.@general[0].serial_port /dev/ttyS1)"
WC_BAUD_RATES="$(wc_get webcam.@general[0].baud_rates 9600)"

#
# Heating (anti-appannamento)
#
WC_HEATING="$(wc_get webcam.@general[0].heating 0)"
WC_HEAT_DEWPOINT_MARGIN="$(wc_get webcam.@general[0].heat_dewpoint_margin 3)"
WC_HEAT_HYSTERESIS="$(wc_get webcam.@general[0].heat_hysteresis 2)"
WC_HEAT_MIN_TEMP="$(wc_get webcam.@general[0].heat_min_temp 3)"
WC_HEAT_FAN="$(wc_get webcam.@general[0].heat_fan 1)"

#
# Camera Setting
#
WC_PHOTO_NAME="$(wc_get webcam.@shooting[0].photo_name webcam)"
# Minuti (anche negativi) da aggiungere ad alba e tramonto per il
# passaggio tra impostazioni diurne e notturne
WC_SUNRISE_OFFSET="$(wc_get webcam.@shooting[0].sunrise_offset 0)"
WC_SUNSET_OFFSET="$(wc_get webcam.@shooting[0].sunset_offset 0)"

#
# Day Shooting Setting (indici delle scelte di gphoto2; vuoto = non modificare)
#
WC_ISO_DAY="$(wc_get webcam.@day[0].iso_day)"
WC_APERTURE_DAY="$(wc_get webcam.@day[0].aperture_day)"
WC_SHUTTERSPEED_DAY="$(wc_get webcam.@day[0].shutterspeed_day)"

#
# Night Shooting Setting (indici delle scelte di gphoto2; vuoto = non modificare)
#
WC_ISO_NIGHT="$(wc_get webcam.@night[0].iso_night)"
WC_APERTURE_NIGHT="$(wc_get webcam.@night[0].aperture_night)"
WC_SHUTTERSPEED_NIGHT="$(wc_get webcam.@night[0].shutterspeed_night)"

#
# Upload Server
#
WC_UPLOAD_PROTOCOL="$(wc_get webcam.@server[0].upload_protocol ftp)"
WC_UPLOAD_SERVER="$(wc_get webcam.@server[0].upload_server)"
WC_UPLOAD_PORT="$(wc_get webcam.@server[0].upload_port)"
WC_UPLOAD_DIRECTORY="$(wc_get webcam.@server[0].upload_directory)"
WC_UPLOAD_USERNAME="$(wc_get webcam.@server[0].upload_username)"
WC_UPLOAD_PASSWORD="$(wc_get webcam.@server[0].upload_password)"
WC_UPLOAD_KEY="$(wc_get webcam.@server[0].upload_key)"
WC_UPLOAD_INSECURE="$(wc_get webcam.@server[0].upload_insecure 0)"
# Archivio in sottocartelle AAAA/MM/GG
WC_UPLOAD_DATE_DIRS="$(wc_get webcam.@server[0].upload_date_dirs 0)"
# Copia dell'ultima foto con nome fisso (es. current.jpg)
WC_UPLOAD_LATEST="$(wc_get webcam.@server[0].upload_latest 0)"
WC_UPLOAD_LATEST_NAME="$(wc_get webcam.@server[0].upload_latest_name current)"
# File .json con i dati dello scatto accanto a ogni foto
WC_UPLOAD_DATA="$(wc_get webcam.@server[0].upload_data 0)"
# Coda delle foto non caricate: limite in MB (0 = disattivata) e cartella
# (vuota = /tmp/webcam/queue in RAM; su chiavetta USB deve già esistere)
WC_QUEUE_SIZE="$(wc_get webcam.@server[0].queue_size 20)"
WC_QUEUE_DIR="$(wc_get webcam.@server[0].queue_dir)"

#
# File di stato (letti dalla pagina Status di LuCI)
#
WC_STATE_DIR=/tmp/webcam
