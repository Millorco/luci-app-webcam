# Server centrale per le webcam: tunnel WireGuard + raccolta dei log.
# Guida completa in server/README.md.
#
# I router entrano nel tunnel e mandano il syslog a 10.13.13.1:514 (TCP).
# VictoriaLogs condivide la rete del container WireGuard, quindi la porta
# 514 è raggiungibile solo dal tunnel e non da Internet.

services:
  wireguard:
    image: lscr.io/linuxserver/wireguard:1.0.20260223
    container_name: wireguard
    cap_add:
      - NET_ADMIN
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Rome
      # Nome DNS o IP pubblico del VPS
      - SERVERURL=vps.example.com
      - SERVERPORT=51820
      # Un peer per ogni router, più uno per il tuo PC (per l'interfaccia dei log)
      - PEERS=webcam1,webcam2,pc
      - INTERNAL_SUBNET=10.13.13.0
      # I peer instradano nel tunnel solo la rete del tunnel, non tutto il traffico
      - ALLOWEDIPS=10.13.13.0/24
      - PERSISTENTKEEPALIVE_PEERS=all
      - LOG_CONFS=false
    volumes:
      - ./wireguard:/config
    ports:
      - 51820:51820/udp
      # Interfaccia web di VictoriaLogs, solo da localhost del VPS
      # (da fuori: tunnel SSH, oppure dal peer "pc" su http://10.13.13.1:9428)
      - 127.0.0.1:9428:9428
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    restart: unless-stopped

  victorialogs:
    image: victoriametrics/victoria-logs:v1.53.0
    container_name: victorialogs
    network_mode: service:wireguard
    depends_on:
      - wireguard
    command:
      - -storageDataPath=/vlogs
      - -retentionPeriod=30d
      - -httpListenAddr=:9428
      - -syslog.listenAddr.tcp=:514
      - -syslog.listenAddr.udp=:514
      # L'ora dei messaggi è quella di arrivo: i router appena riavviati
      # possono non avere ancora l'ora giusta da NTP
      - -syslog.useLocalTimestamp.tcp
      - -syslog.useLocalTimestamp.udp
    volumes:
      - ./vlogs:/vlogs
    restart: unless-stopped
