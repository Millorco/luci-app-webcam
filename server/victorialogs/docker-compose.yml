# VictoriaLogs da solo, senza VPN: i router mandano il syslog direttamente
# all'IP pubblico del VPS. Guida in server/victorialogs/README.md.
#
# - Syslog TCP sulla porta 5140, aperta su Internet: limitala con il
#   firewall (vedi README, catena DOCKER-USER).
# - Interfaccia web e API sulla 9428 solo da localhost del VPS, con
#   utente "admin" e la password del file ./vl_password: ci si arriva
#   con un tunnel SSH.

services:
  victorialogs:
    image: victoriametrics/victoria-logs:v1.53.0
    container_name: victorialogs
    restart: unless-stopped
    ports:
      - 5140:5140/tcp
      - 127.0.0.1:9428:9428
    volumes:
      - ./vlogs:/vlogs
      - ./vl_password:/vl_password:ro
    command:
      - -storageDataPath=/vlogs
      # Tiene 30 giorni di log, ma mai più di 5 GB su disco
      - -retentionPeriod=30d
      - -retention.maxDiskSpaceUsageBytes=5GiB
      - -httpListenAddr=:9428
      - -httpAuth.username=admin
      - -httpAuth.password=file:///vl_password
      # Syslog di OpenWrt (logd) via TCP. L'ora è quella di arrivo: i router
      # appena riavviati possono non avere ancora l'ora giusta.
      - -syslog.listenAddr.tcp=:5140
      - -syslog.useLocalTimestamp.tcp
